name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: country-ip-blocklist/go.mod
          cache: true
          cache-dependency-path: country-ip-blocklist/go.sum

      - name: Run tests
        working-directory: country-ip-blocklist
        run: go test ./...

      - name: Test Windows Firewall rule lifecycle
        working-directory: country-ip-blocklist
        env:
          COUNTRY_IP_BLOCKLIST_FIREWALL_INTEGRATION: "1"
        run: go test ./internal/firewall -run '^TestWindowsFirewallRuleLifecycle$' -count=1

      - name: Run go vet
        working-directory: country-ip-blocklist
        run: go vet ./...

      - name: Build Windows executable
        working-directory: country-ip-blocklist
        run: go build -o "$env:RUNNER_TEMP\country-ip-blocklist.exe" ./cmd/country-ip-blocklist
